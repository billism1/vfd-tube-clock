# ESPHome Integration Configuration for VFD Tube Clock
# This file shows how to integrate the VFD clock with Home Assistant via ESPHome
# Place this in your ESPHome configuration directory and adapt as needed

# Note: This assumes the VFD clock is running the custom firmware at IP address
# You'll need to replace the IP address with your actual clock's IP

# HTTP Request sensors and switches for VFD Clock integration
http_request:
  - url: http://192.168.86.104  # Replace with your VFD clock's IP address
    method: GET
    timeout: 10s
    id: vfd_clock_request

# Binary sensor for VFD filament state
binary_sensor:
  - platform: http_request
    http_request_id: vfd_clock_request
    name: "VFD Clock Filament State"
    url: "/status"
    json_path: "$.filament_state"
    device_class: "power"
    entity_category: "diagnostic"

# Switch to control VFD filament
switch:
  - platform: template
    name: "VFD Clock Filament"
    id: vfd_filament_switch
    optimistic: false
    turn_on_action:
      - http_request.get:
          url: http://192.168.86.104/filament/toggle  # Replace with your IP
    turn_off_action:
      - http_request.get:
          url: http://192.168.86.104/filament/toggle  # Replace with your IP
    lambda: |-
      // Query the current state from the clock
      // This is a simplified approach - in a real implementation,
      // you might want to use the status endpoint to get the actual state

# Text sensors for various clock states
text_sensor:
  - platform: http_request
    http_request_id: vfd_clock_request
    name: "VFD Clock Display Mode"
    url: "/status"
    json_path: "$.display_mode"
    entity_category: "diagnostic"
    
  - platform: http_request
    http_request_id: vfd_clock_request
    name: "VFD Clock Custom Text"
    url: "/status"
    json_path: "$.custom_text"
    entity_category: "diagnostic"
    
  - platform: http_request
    http_request_id: vfd_clock_request
    name: "VFD Clock Current Time"
    url: "/status"
    json_path: "$.current_time"
    entity_category: "diagnostic"

# Numeric sensors for monitoring
sensor:
  - platform: http_request
    http_request_id: vfd_clock_request
    name: "VFD Clock Uptime"
    url: "/status"
    json_path: "$.uptime_ms"
    unit_of_measurement: "ms"
    device_class: "duration"
    entity_category: "diagnostic"
    
  - platform: http_request
    http_request_id: vfd_clock_request
    name: "VFD Clock Boost Duty Cycle"
    url: "/status"
    json_path: "$.boost_duty_cycle"
    unit_of_measurement: "%"
    entity_category: "diagnostic"
    
  - platform: http_request
    http_request_id: vfd_clock_request
    name: "VFD Clock Target Voltage"
    url: "/status"
    json_path: "$.target_voltage"
    unit_of_measurement: "V"
    device_class: "voltage"
    entity_category: "diagnostic"

